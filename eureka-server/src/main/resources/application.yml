server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # Standalone registry: don't register with itself or fetch registry
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # Faster eviction in dev; production tuning would be different.
    eviction-interval-timer-in-ms: 5000
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

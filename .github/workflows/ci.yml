name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    name: Backend Build, Test & Docker Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Unit Tests
        run: mvn -B clean test

      - name: Package JARs
        run: mvn -B package -DskipTests

      - name: Validate Docker Images Build
        run: |
          docker build --build-arg SERVICE=auth-service -t ecommerce/auth-service:latest -f Dockerfile.service .
          docker build --build-arg SERVICE=product-service -t ecommerce/product-service:latest -f Dockerfile.service .
          docker build --build-arg SERVICE=inventory-service -t ecommerce/inventory-service:latest -f Dockerfile.service .
          docker build --build-arg SERVICE=order-service -t ecommerce/order-service:latest -f Dockerfile.service .

      - name: Login & Push to Docker Hub (Optional)
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker push ecommerce/auth-service:latest
          docker push ecommerce/product-service:latest
          docker push ecommerce/inventory-service:latest
          docker push ecommerce/order-service:latest

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install Dependencies
        working-directory: admin-dashboard
        run: npm ci

      - name: Typecheck and Build Bundle
        working-directory: admin-dashboard
        run: npm run build
